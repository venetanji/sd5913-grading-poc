[project]
name = "sd5913-grading-poc"
version = "0.1.0"
description = "Local-first, evidence-bounded grading workflow prototype for SD5913"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
laya-local = ["laya==0.3.28", "torch==2.14.1"]

[project.scripts]
sd5913-grade-poc = "grading_poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grading_poc"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
